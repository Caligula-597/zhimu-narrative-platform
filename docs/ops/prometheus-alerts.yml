# Example Prometheus alert rules for 织幕 API
# Mount in Prometheus: rule_files: [ "prometheus-alerts.yml" ]

groups:
  - name: zhimu-api
    rules:
      - alert: Api5xxRateHigh
        expr: sum(rate(http_errors_5xx_total[5m])) > 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "织幕 API 5xx 速率过高"
          description: "5xx rate {{ $value }}/s over 5m"

      - alert: UploadScanRejectedHigh
        expr: sum(rate(upload_scans_rejected_total[10m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "上传扫描拒绝率升高"
          description: "upload_scans_rejected_total rate {{ $value }}/s"

      - alert: ApiReadyGaugeZero
        expr: api_ready == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "织幕 API readiness 指标为 0"
          description: "api_ready gauge reports not ready"

      - alert: ApiReadyFailing
        expr: probe_success{job="zhimu-ready"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "织幕 readiness 探针失败"
          description: "GET /api/health/ready 连续失败"

      - alert: DbPoolWaiting
        expr: db_pool_waiting > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 连接池有等待客户端"
          description: "db_pool_waiting={{ $value }}"

      - alert: SseConnectionsHigh
        expr: sse_connections_active > 5000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSE 连接数偏高"
          description: "sse_connections_active={{ $value }}"
