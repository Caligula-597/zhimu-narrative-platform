name: Production Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            play/package-lock.json
            host/package-lock.json

      - name: Build expected Creator artifact
        run: npm ci && npm run build
        env:
          VITE_API_BASE: /api
          VITE_REQUIRE_AUTH: "true"
          VITE_DEMO_MODE: "false"

      - name: Build and verify immutable Pages previews
        run: node scripts/pages-release-ci.mjs --prepare
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install pinned Railway CLI
        run: npm install -g @railway/cli@5.27.2

      - name: Deploy fullstack API and creator frontend
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUIRE_DEPLOY: "true"
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ACCOUNT_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_PUBLIC_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
          REQUIRE_CREATOR_FRONTEND_SYNC: "true"
        run: node scripts/railway-deploy-ci.mjs

      - name: Verify production trust gates
        env:
          APP_PUBLIC_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
          REQUIRE_CREATOR_FRONTEND_SYNC: "true"
        run: npm run check:production-ready

      - name: Monitoring and alert webhook smoke
        env:
          APP_PUBLIC_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: npm run monitoring:smoke -- --alerts

      - name: Promote verified Pages artifacts
        run: node scripts/pages-release-ci.mjs --promote
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PUBLIC_URL: https://getzhimu.com
          PLAY_SITE_URL: https://play.getzhimu.com
          HOST_SITE_URL: https://host.getzhimu.com
          APP_PUBLIC_URL: https://app.getzhimu.com
