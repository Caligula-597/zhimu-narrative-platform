name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy fullstack (API + frontend, one service)
        env:
          GITHUB_SHA: ${{ github.sha }}
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ACCOUNT_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_PUBLIC_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
        run: node scripts/railway-deploy-ci.mjs
      - name: Verify production trust gates
        env:
          APP_PUBLIC_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
        run: npm run check:production-ready
      - name: Monitoring and alert webhook smoke
        env:
          APP_PUBLIC_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: npm run monitoring:smoke -- --alerts
