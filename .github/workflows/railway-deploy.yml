name: Deploy API to Railway

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "backend/Dockerfile"
      - "backend/railway.json"
      - ".github/workflows/railway-deploy.yml"
  workflow_dispatch:

concurrency:
  group: railway-api-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend (--path-as-root, Dockerfile only)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_PUBLIC_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "::warning::Skip Railway deploy — add RAILWAY_TOKEN and RAILWAY_SERVICE_ID to GitHub Secrets."
            echo "See docs/ops/RAILWAY.md"
            exit 0
          fi
          railway up backend --path-as-root --ci --service "$RAILWAY_SERVICE_ID"
          if [ -n "$RAILWAY_PUBLIC_URL" ]; then
            for i in $(seq 1 30); do
              if curl -sf "$RAILWAY_PUBLIC_URL/api/health/ready" | grep -q '"ready":true'; then
                echo "API ready at $RAILWAY_PUBLIC_URL"
                exit 0
              fi
              echo "Waiting for health... ($i/30)"
              sleep 10
            done
            echo "::warning::Health check timed out — check Railway deploy logs"
          fi
