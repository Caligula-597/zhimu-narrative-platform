name: CI

on:
  push:
    branches: [main, master, codex/**]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zhimu
          POSTGRES_USER: zhimu
          POSTGRES_PASSWORD: replace_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhimu -d zhimu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://zhimu:replace_me@localhost:5432/zhimu
      ALLOW_DEMO_USER_HEADER: "true"
      REGISTER_IP_DAY_MAX: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            host/package-lock.json
            play/package-lock.json
            site/package-lock.json
            package-lock.json
      - name: Pin npm with SBOM dependency-tree fixes
        run: npm install --global npm@11.17.0
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci && npm run ensure:esm
      - name: Source, contract, architecture, and nonfunctional gates
        run: |
          npm run check:source-encoding
          npm run check:contracts
          npm run check:world-writes
          npm run check:architecture
          npm run audit:nonfunctional
      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit --with-deps
      - name: Build frontend
        run: npm run build
      - name: Frontend module load check
        run: npm run check:modules
      - name: Frontend interaction contract check
        run: npm run check:ui-interactions
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed && npm run demo:seed-exploration
        working-directory: backend
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Verify pg_dump version
        run: pg_dump --version | grep -E " 17\\."
      - name: DB backup smoke
        run: node scripts/pg-backup.mjs --out /tmp/zhimu-ci-backup.sql
        working-directory: backend
        env:
          PG_CLIENT_BIN_DIR: /usr/lib/postgresql/17/bin
      - name: DB backup restore drill
        run: npm run db:verify-restore
        working-directory: backend
        env:
          PG_CLIENT_BIN_DIR: /usr/lib/postgresql/17/bin
      - name: DB migration upgrade drill
        run: npm run db:verify-migration-upgrade
        working-directory: backend
      - name: Syntax and module graph check
        run: npm run check && npm run check:schemas
        working-directory: backend
      - name: Boot validation
        run: npm run check:boot
        working-directory: backend
      - name: Unit and integration tests
        run: npm run check:tests && npm test
        working-directory: backend
      - name: All root unit and contract tests
        run: npm run test:root
      - name: Verified empty-account browser journey
        run: npm run test:empty-account:browser
      - name: Install play portal dependencies
        run: npm ci
        working-directory: play
      - name: Build play portal
        run: npm run build
        working-directory: play
      - name: Play portal unit tests
        run: npm run test:play
      - name: Install host portal dependencies
        run: npm ci
        working-directory: host
      - name: Build and test host portal
        run: npm run check
        working-directory: host
      - name: Install and build marketing site
        run: npm ci && npm run build
        working-directory: site
      - name: Enforce production bundle budgets
        run: npm run check:bundle-budgets
      - name: Start backend for smoke tests
        run: node src/server.js &
        working-directory: backend
        env:
          OFFICIAL_EXAMPLE_WORLD_ID: "33333333-3333-4333-8444-555555550003"
          GUEST_CREATE_HOUR_MAX: "1000"
          GUEST_CREATE_DAY_MAX: "1000"
          PLAY_SOCIAL_ACCOUNT_COOLDOWN_MIN: "0"
      - name: Start frontend for UI smoke
        run: node server.js --dist &
        working-directory: .
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4180/api/health >/dev/null && curl -sf http://localhost:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: API smoke tests
        run: npm run test:smoke
        working-directory: backend
      - name: UI smoke tests
        run: node scripts/ui-smoke.js
      - name: Reset fixture room for E2E
        run: npm run e2e:reset-fixture-room
        working-directory: backend
      - name: Start app dev server for source-aware E2E
        run: npm run dev -- --port 4176 --strictPort &
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:4180
      - name: Start play dev for E2E
        run: npm run dev -- --port 5174 --strictPort &
        working-directory: play
      - name: Start host dev for E2E
        run: npm run dev -- --port 5175 --strictPort &
        working-directory: host
      - name: Wait for E2E dev servers
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4176/ >/dev/null \
              && curl -sf http://localhost:5174/ >/dev/null \
              && curl -sf http://localhost:5175/ >/dev/null \
              && exit 0
            sleep 1
          done
          exit 1
      - name: Playwright E2E
        timeout-minutes: 20
        run: npx playwright test --max-failures=1
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
          PLAYWRIGHT_BROWSERS: chromium
          PLAYWRIGHT_INVITE_CODE: TEST-FIXTURE-DEMO
          PLAYWRIGHT_API_URL: http://localhost:4180
          PLAYWRIGHT_BASE_URL: http://localhost:4176
          PLAYWRIGHT_PLAY_URL: http://localhost:5174
          PLAYWRIGHT_HOST_URL: http://localhost:5175
          GUEST_CREATE_HOUR_MAX: "1000"
          GUEST_CREATE_DAY_MAX: "1000"
          PLAY_SOCIAL_ACCOUNT_COOLDOWN_MIN: "0"
          OFFICIAL_EXAMPLE_WORLD_ID: "33333333-3333-4333-8444-555555550003"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            host/package-lock.json
            play/package-lock.json
            site/package-lock.json
            package-lock.json
      - name: Pin npm with SBOM dependency-tree fixes
        run: npm install --global npm@11.17.0
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install root dependencies
        run: npm ci
      - name: Install portal dependencies
        run: |
          npm ci --prefix play
          npm ci --prefix host
          npm ci --prefix site
      - name: npm audit (all workspaces, high+)
        run: |
          npm audit --audit-level=high
          npm --prefix backend audit --audit-level=high
          npm --prefix play audit --audit-level=high
          npm --prefix host audit --audit-level=high
          npm --prefix site audit --audit-level=high
      - name: innerHTML XSS budget
        run: npm run audit:innerhtml
      - name: Generate SBOM (root)
        run: npm sbom --sbom-format=cyclonedx --omit dev > sbom-root.cdx.json
      - name: Generate SBOM (backend)
        run: npm --prefix backend sbom --sbom-format=cyclonedx --omit dev > backend/sbom-backend.cdx.json
      - name: Generate portal SBOMs
        run: |
          npm --prefix play sbom --sbom-format=cyclonedx > sbom-play.cdx.json
          npm --prefix host sbom --sbom-format=cyclonedx > sbom-host.cdx.json
          npm --prefix site sbom --sbom-format=cyclonedx > sbom-site.cdx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom-root.cdx.json
            backend/sbom-backend.cdx.json
            sbom-play.cdx.json
            sbom-host.cdx.json
            sbom-site.cdx.json
          retention-days: 30

  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
      - name: Perform CodeQL analysis
        id: codeql-analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: /language:javascript-typescript
          output: codeql-results
          upload: never
          upload-database: false
      - name: Enforce CodeQL no-new-finding gate
        run: node scripts/check-codeql-baseline.mjs codeql-results
      - name: Upload CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: codeql-results/
          if-no-files-found: error
          retention-days: 30

  pages-preview:
    name: Cloudflare Pages preview smoke
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/') }}
    needs: [ci, security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            play/package-lock.json
            host/package-lock.json
      - name: Build, deploy, and verify website previews
        run: node scripts/pages-release-ci.mjs --prepare
        env:
          RELEASE_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
