name: CI

on:
  push:
    branches: [main, master, codex/**]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zhimu
          POSTGRES_USER: zhimu
          POSTGRES_PASSWORD: replace_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhimu -d zhimu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://zhimu:replace_me@localhost:5432/zhimu
      ALLOW_DEMO_USER_HEADER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci && npm run ensure:esm
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Build frontend
        run: npm run build
      - name: Frontend module load check
        run: npm run check:modules
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed && npm run demo:seed-exploration
        working-directory: backend
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: DB backup smoke
        run: node scripts/pg-backup.mjs --out /tmp/zhimu-ci-backup.sql
        working-directory: backend
      - name: Syntax and module graph check
        run: npm run check && npm run check:schemas
        working-directory: backend
      - name: Boot validation
        run: npm run check:boot
        working-directory: backend
      - name: Unit and integration tests
        run: npm run check:tests && npm test
        working-directory: backend
      - name: Format helper tests
        run: npm run test:format-helpers
      - name: Modal helper tests
        run: npm run test:modal-helpers
      - name: Start backend for smoke tests
        run: node src/server.js &
        working-directory: backend
      - name: Start frontend for UI smoke
        run: node server.js --dist &
        working-directory: .
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4180/api/health >/dev/null && curl -sf http://localhost:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: API smoke tests
        run: npm run test:smoke
        working-directory: backend
      - name: UI smoke tests
        run: node scripts/ui-smoke.js
