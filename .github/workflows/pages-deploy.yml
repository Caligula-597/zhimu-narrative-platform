name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: site
            project: zhimu-site
            working-directory: site
            url-env: SITE_PUBLIC_URL
            public-url: https://getzhimu.com
          - name: play
            project: zhimu-play
            working-directory: play
            url-env: PLAY_SITE_URL
            public-url: https://play.getzhimu.com
          - name: host
            project: zhimu-host
            working-directory: host
            url-env: HOST_SITE_URL
            public-url: https://host.getzhimu.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            play/package-lock.json
            host/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.working-directory }}
      - name: Build ${{ matrix.name }}
        run: npm run build
        working-directory: ${{ matrix.working-directory }}
        env:
          VITE_API_ORIGIN: https://app.getzhimu.com
          VITE_APP_ORIGIN: https://app.getzhimu.com
          VITE_PLAY_ORIGIN: https://play.getzhimu.com
      - name: Deploy ${{ matrix.name }} to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name=${{ matrix.project }} --branch=main --commit-dirty=true
        working-directory: ${{ matrix.working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    runs-on: ubuntu-latest
    needs: pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke deployed Pages
        run: node scripts/pages-smoke.mjs
        env:
          SITE_PUBLIC_URL: https://getzhimu.com
          PLAY_SITE_URL: https://play.getzhimu.com
          HOST_SITE_URL: https://host.getzhimu.com
          APP_PUBLIC_URL: https://app.getzhimu.com
