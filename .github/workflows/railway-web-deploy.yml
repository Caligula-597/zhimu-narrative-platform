name: Deploy Web to Railway

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "config/**"
      - "src/**"
      - "frontend/**"
      - "docs/**"
      - "index.html"
      - "app.js"
      - "config.js"
      - "dom.js"
      - "state.js"
      - "styles.css"
      - "rule-visual.js"
      - "server.js"
      - "package.json"
      - ".github/workflows/railway-web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: railway-web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy frontend (web/Dockerfile)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WEB_SERVICE_ID: ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_WEB_SERVICE_ID" ]; then
            echo "::warning::Skip Web deploy — add RAILWAY_TOKEN and RAILWAY_WEB_SERVICE_ID to GitHub Secrets."
            echo "See docs/ops/RAILWAY_WEB.md"
            exit 0
          fi
          railway up --ci --service "$RAILWAY_WEB_SERVICE_ID"
