name: Guardian Poll

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "API base URL (no trailing slash)"
        required: false
        default: "https://app.getzhimu.com"
      product_probes:
        description: "Run fixture product probes (local/staging only; needs demo headers)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guardian-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_PUBLIC_URL: ${{ github.event.inputs.target_url || 'https://app.getzhimu.com' }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Guardian poll (health + metrics + web-vitals)
        # Production: no product probes — demo user headers are disabled there.
        run: node scripts/guardian-poll.mjs --web-vitals
      - name: Guardian poll with alerts (optional)
        if: env.OPS_API_TOKEN != ''
        run: node scripts/guardian-poll.mjs --alerts
        continue-on-error: true
      - name: Product probes (manual opt-in only)
        if: github.event.inputs.product_probes == 'true'
        run: node scripts/guardian-poll.mjs --product-probes
        continue-on-error: true

  guardian-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.STAGING_APP_URL != ''
    env:
      APP_PUBLIC_URL: ${{ vars.STAGING_APP_URL }}
      METRICS_TOKEN: ${{ secrets.STAGING_METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Guardian poll (staging health + metrics + product probes)
        # Staging may enable ALLOW_DEMO_USER_HEADER for fixture probes.
        run: node scripts/guardian-poll.mjs --web-vitals --product-probes
