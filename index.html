<!doctype html>

<html lang="zh-CN">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>织幕 · 长线互动叙事引擎</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles.css" />

  </head>

  <body>

    <div class="app-shell">

      <aside class="sidebar">

        <div class="brand">

          <div class="brand-mark">织</div>

          <div>

            <div class="brand-name">织幕</div>

            <div class="brand-subtitle">NARRATIVE ENGINE</div>

          </div>

        </div>



        <div class="world-switcher">

          <span class="world-icon">云</span>

          <div>

            <strong>正在读取世界</strong>

            <small>连接云端创作空间</small>

          </div>

          <span class="chevron">⌄</span>

        </div>

        <button class="create-world-btn" id="create-world-btn"><span>＋</span> 创建新世界</button>

        <button class="catalog-world-btn" id="catalog-world-btn" type="button"><span>◈</span> 公开剧本库</button>



        <nav class="main-nav" aria-label="主导航">

          <p class="nav-label">工作区</p>

          <button class="nav-item active" data-view="overview"><span>⌂</span>项目总控</button>

          <button class="nav-item" data-view="production"><span>✎</span>内容生产</button>

          <button class="nav-item" data-view="structure"><span>◇</span>结构编排</button>

          <button class="nav-item" data-view="truth"><span>◈</span>真相与关系</button>

          <button class="nav-item" data-view="publish"><span>▶</span>测试与发布</button>

          <button class="nav-item" data-view="insights"><span>◷</span>复盘改本</button>

          <button type="button" class="nav-expand-btn" data-action="toggle-nav-advanced" aria-expanded="false" aria-controls="nav-advanced">⋯ 更多创作工具</button>

          <div class="nav-advanced" id="nav-advanced" hidden>

            <button class="nav-item" data-view="writer"><span>✎</span>角色私人剧本</button>

            <button class="nav-item" data-view="studio"><span>◇</span>剧情编排图谱</button>

            <button class="nav-item" data-view="clues"><span>◆</span>线索管理</button>

            <button class="nav-item" data-view="rules"><span>⌘</span>自动化规则</button>

            <button class="nav-item" data-view="miniGames"><span>#</span>小游戏设计</button>

            <button class="nav-item" data-view="archive"><span>◷</span>存档与复盘</button>

          </div>

          <p class="nav-label">帮助</p>

          <button class="nav-item" data-action="open-creator-guide"><span>?</span>创作指引</button>

        </nav>



        <div class="sidebar-bottom">

          <button class="nav-item muted" data-view="account"><span>👤</span>账号与资产</button>

          <button class="nav-item muted" data-view="settings"><span>⚙</span>世界设置</button>

          <button class="nav-item muted" data-view="ops"><span>OPS</span>运营</button>

          <div class="profile">

            <div class="avatar small">沈</div>

            <div><strong>沈舟</strong><small>主创作者</small></div>

            <span class="online"></span>

          </div>

        </div>

      </aside>



      <main class="main-area">

        <div id="auth-banner" class="auth-banner" hidden>
          <div class="auth-banner-copy">
            <span class="cloud-pill session-pill" data-session-pill hidden></span>
            <strong data-session-title>请登录后继续使用</strong>
            <p data-session-desc>登录后可保存剧本、邀请协作并记录运行数据。</p>
          </div>
          <button type="button" class="primary-btn" id="auth-banner-login">登录 / 注册</button>
        </div>

        <header class="topbar">

          <div>

            <p class="eyebrow" id="page-eyebrow">世界工作区</p>

            <h1 id="page-title">世界总览</h1>

          </div>

          <div class="topbar-actions">

            <button class="icon-btn" id="search-btn" aria-label="搜索">⌕</button>

            <button class="icon-btn" id="notify-btn" aria-label="通知">♢<i class="notify"></i></button>

            <div class="divider"></div>

            <button class="secondary-btn" id="preview-btn">打开玩家端</button>

            <button class="primary-btn" id="run-btn"><span>▶</span> 打开主持端</button>

          </div>

        </header>



        <div class="content" id="content"></div>

      </main>

    </div>



    <div class="toast" id="toast"></div>

    <div class="modal-backdrop" id="modal-backdrop">

      <section class="modal" id="modal"></section>

    </div>



    <script type="module" src="/frontend/main.js"></script>

  </body>

</html>
