<!doctype html>

<html lang="zh-CN">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex, nofollow, noarchive" />

    <title>织幕 · 长线互动叙事引擎</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles.css" />

  </head>

  <body>

    <a class="skip-link" href="#creator-main">跳到主要内容</a>

    <div class="app-shell">

      <aside class="sidebar">

        <div class="brand">

          <div class="brand-mark">织</div>

          <div>

            <div class="brand-name">织幕</div>

            <div class="brand-subtitle">NARRATIVE ENGINE</div>

          </div>

        </div>



        <div class="world-switcher">

          <span class="world-icon">云</span>

          <div>

            <strong>正在读取世界</strong>

            <small>连接云端创作空间</small>

          </div>

          <span class="chevron">⌄</span>

        </div>

        <div class="sidebar-actions" aria-label="剧本快捷操作">

          <button class="sidebar-action sidebar-action-primary create-world-btn" id="create-world-btn" aria-label="创建新世界" title="创建新世界"><span class="sidebar-action-icon">＋</span><span class="sidebar-action-text">创建世界</span></button>

          <button class="sidebar-action catalog-world-btn" id="catalog-world-btn" type="button" aria-label="打开公开剧本库" title="打开公开剧本库"><span class="sidebar-action-icon">◈</span><span class="sidebar-action-text">剧本库</span></button>

        </div>

        <button class="mobile-account-nav nav-item muted" data-view="account" aria-label="账号与资产" title="账号与资产"><span class="nav-icon">人</span><span class="nav-text">账号与资产</span></button>



        <nav class="main-nav" aria-label="主导航">

          <p class="nav-label" data-product-shell="murder_mystery">剧本杀创作</p>

          <button class="nav-item active" data-view="creatorCockpit" data-product-shell="murder_mystery" aria-label="创作驾驶舱" title="创作驾驶舱"><span class="nav-icon">CC</span><span class="nav-text">创作驾驶舱</span></button>

          <button class="nav-item" data-view="diagnostics" data-product-shell="murder_mystery" aria-label="作品诊断中心" title="作品诊断中心"><span class="nav-icon">✦</span><span class="nav-text">作品诊断中心</span></button>

          <button class="nav-item" data-view="playtest" data-product-shell="murder_mystery" aria-label="玩家试跑实验室" title="玩家试跑实验室"><span class="nav-icon">AI</span><span class="nav-text">玩家试跑实验室</span></button>

          <p class="nav-label" data-product-shell="tabletop_rpg" hidden>跑团创作</p>

          <button class="nav-item" data-view="tabletopMap" data-product-shell="tabletop_rpg" aria-label="跑团地图、判定与遭遇" title="跑团地图、判定与遭遇" hidden><span class="nav-icon">骰</span><span class="nav-text">跑团工作台</span></button>

          <p class="nav-label" data-product-shell="board_game" hidden>桌游创作</p>

          <button class="nav-item" data-view="boardGame" data-product-shell="board_game" aria-label="桌游创作中心" title="桌游创作中心" hidden><span class="nav-icon">棋</span><span class="nav-text">桌游创作中心</span></button>

          <button type="button" class="nav-item nav-expand-btn" data-action="toggle-nav-advanced" data-product-shell="murder_mystery" aria-label="展开剧本杀编辑器" aria-expanded="false" aria-controls="nav-advanced" title="展开或收起剧本杀编辑器"><span class="nav-icon">⋯</span><span class="nav-text" data-nav-advanced-label>剧本杀编辑器</span><span class="nav-chevron" aria-hidden="true">⌄</span></button>

          <div class="nav-advanced" id="nav-advanced" hidden>

            <p class="nav-scope-label" data-nav-product-scope>剧本杀专属工具</p>

            <button class="nav-item" data-view="writer" aria-label="角色私人剧本" title="角色私人剧本"><span class="nav-icon">✎</span><span class="nav-text">角色私人剧本</span></button>

            <button class="nav-item" data-view="truth" aria-label="谜底与关系" title="谜底与关系"><span class="nav-icon">◎</span><span class="nav-text">谜底与关系</span></button>

            <button class="nav-item" data-view="studio" aria-label="剧情编排图谱" title="剧情编排图谱"><span class="nav-icon">◇</span><span class="nav-text">剧情编排图谱</span></button>

            <button class="nav-item" data-view="clues" aria-label="线索管理" title="线索管理"><span class="nav-icon">◆</span><span class="nav-text">线索管理</span></button>

            <button class="nav-item" data-view="miniGames" aria-label="小游戏设计" title="小游戏设计"><span class="nav-icon">#</span><span class="nav-text">小游戏设计</span></button>

            <p class="nav-scope-label" data-nav-shared-scope>剧本杀运行工具</p>

            <button class="nav-item" data-view="rules" aria-label="自动化规则" title="自动化规则"><span class="nav-icon">⌘</span><span class="nav-text">自动化规则</span></button>

            <button class="nav-item" data-view="archive" aria-label="存档与复盘" title="存档与复盘"><span class="nav-icon">◷</span><span class="nav-text">存档与复盘</span></button>

          </div>

          <p class="nav-label" data-product-shell="murder_mystery">帮助</p>

          <button class="nav-item" data-action="open-creator-guide" data-product-shell="murder_mystery" aria-label="打开剧本杀创作指引" title="打开剧本杀创作指引"><span class="nav-icon">?</span><span class="nav-text">创作指引</span></button>

        </nav>



        <div class="sidebar-bottom">

          <p class="nav-label sidebar-bottom-label">管理</p>

          <button class="nav-item muted" data-view="account" aria-label="账号与资产" title="账号与资产"><span class="nav-icon">人</span><span class="nav-text">账号与资产</span></button>

          <button class="nav-item muted" data-view="settings" aria-label="世界设置" title="世界设置"><span class="nav-icon">⚙</span><span class="nav-text">世界设置</span></button>

          <button class="nav-item muted" data-view="ops" aria-label="运营" title="运营"><span class="nav-icon">OP</span><span class="nav-text">运营</span></button>

          <div class="profile">

            <div class="avatar small">沈</div>

            <div><strong>沈舟</strong><small>主创作者</small></div>

            <span class="online"></span>

          </div>

        </div>

      </aside>



      <main class="main-area" id="creator-main" tabindex="-1">

        <div id="auth-banner" class="auth-banner" hidden>
          <div class="auth-banner-copy">
            <span class="cloud-pill session-pill" data-session-pill hidden></span>
            <strong data-session-title>请登录后继续使用</strong>
            <p data-session-desc>登录后可保存剧本、邀请协作并记录运行数据。</p>
          </div>
          <button type="button" class="primary-btn" id="auth-banner-login">登录 / 注册</button>
        </div>

        <header class="topbar">

          <div>

            <p class="eyebrow" id="page-eyebrow">世界工作区</p>

            <h1 id="page-title" tabindex="-1">世界总览</h1>

          </div>

          <div class="topbar-actions">

            <button class="icon-btn" id="search-btn" aria-label="搜索">⌕</button>

            <button class="icon-btn" id="notify-btn" aria-label="通知">♢<i class="notify"></i></button>

            <div class="divider"></div>

            <button class="secondary-btn" id="preview-btn">打开玩家端</button>

            <button class="primary-btn" id="run-btn"><span>▶</span> 打开主持端</button>

          </div>

        </header>



        <div class="content" id="content"></div>

      </main>

    </div>



    <div class="toast" id="toast"></div>

    <div class="modal-backdrop" id="modal-backdrop">

      <section class="modal" id="modal" role="dialog" aria-modal="true" tabindex="-1"></section>

    </div>



    <script type="module" src="/frontend/main.js"></script>

  </body>

</html>
