# Local preview only: Postgres on 5433 (avoid Windows PG on 5432).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zhimu
      POSTGRES_USER: zhimu
      POSTGRES_PASSWORD: zhimu_preview
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhimu -d zhimu"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - zhimu_preview_pg:/var/lib/postgresql/data

volumes:
  zhimu_preview_pg:
