# Single Railway service: API + frontend (deploy/Dockerfile.fullstack)
# CI: railway up --ci --service $RAILWAY_SERVICE_ID  (repo root)
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile.fullstack"
watchPatterns = ["backend/**", "deploy/**", "config/**", "src/**", "frontend/**", "index.html", "package.json"]

[deploy]
startCommand = ""
healthcheckPath = "/api/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
