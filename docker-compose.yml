services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zhimu
      POSTGRES_USER: zhimu
      POSTGRES_PASSWORD: replace_me
    ports:
      - "5432:5432"
    volumes:
      - zhimu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhimu -d zhimu"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  zhimu_postgres_data:
